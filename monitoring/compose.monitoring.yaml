# ============================================================================
# compose.monitoring.yaml : supervision de la « prod » TaskFlow (Jour 4)
#
#     cd monitoring
#     docker compose -f compose.monitoring.yaml up -d
#
#   Grafana        http://localhost:3001   (admin / $GRAFANA_ADMIN_PASSWORD, « admin » par défaut)
#   Prometheus     http://localhost:9090   (Status > Targets, Alerts, Graph)
#   Alertmanager   http://localhost:9093   (alertes actives, silences)
#   Mailpit        http://localhost:8025   (les mails envoyés par Alertmanager)
#
# Comment Prometheus voit-il l'API, qui ne publie aucun port ?
#   Il REJOINT le réseau de la prod (« taskflow-prod », nommé explicitement dans
#   compose.prod.yaml) : il y résout « api » et « front » comme le font les
#   services de la prod. /metrics n'est donc jamais exposée hors de Docker.
#   La prod doit tourner AVANT (sinon : « network taskflow-prod not found »).
#
# Les ports sont publiés sur 127.0.0.1 seulement : pas de Grafana ouvert au réseau
# de la salle. La configuration est en code (provisioning) : rien à cliquer.
# ============================================================================

name: taskflow-monitoring

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle # POST /-/reload : recharger la configuration sans redémarrer
      - --web.external-url=http://localhost:${PROMETHEUS_PORT:-9090} # liens cliquables dans les notifications
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/tests:/etc/prometheus/tests:ro
      - prometheus-data:/prometheus
    networks: [monitoring, taskflow]
    restart: unless-stopped

  # Sondes « boîte noire » : interroge /health COMME un utilisateur (via le front Nginx).
  blackbox:
    image: docker.io/prom/blackbox-exporter:v0.29.1
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitoring, taskflow]
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:${ALERTMANAGER_PORT:-9093}
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [monitoring]
    restart: unless-stopped

  # Faux serveur de mail : reçoit les notifications d'Alertmanager (rien ne sort du poste).
  mailpit:
    image: docker.io/axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [monitoring]
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:12.0.10
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskflow-red.json
    volumes:
      # Datasource et dashboards en code : un `down -v` puis `up` redonne le même Grafana.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring: {}
  # Le réseau de la prod, créé par compose.prod.yaml : on s'y RACCORDE (external),
  # on ne le crée pas. TASKFLOW_NETWORK permet de viser une autre stack (démo).
  taskflow:
    name: ${TASKFLOW_NETWORK:-taskflow-prod}
    external: true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
