# ============================================================================
# prometheus.yml : QUOI collecter, à quelle fréquence, et où envoyer les alertes.
# Prometheus TIRE (pull) les métriques : c'est lui qui appelle les cibles.
#
# Vérifier avant de recharger :
#   docker compose -f compose.monitoring.yaml exec prometheus promtool check config /etc/prometheus/prometheus.yml
#   curl -X POST http://localhost:9090/-/reload
# ============================================================================
global:
  scrape_interval: 15s # une collecte toutes les 15 s
  evaluation_interval: 15s # les règles (alertes) sont évaluées au même rythme

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus se surveille lui-même (qui surveille le surveillant ?)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Boîte blanche : les métriques exposées par l'API (prom-client).
  # « api » est le nom du service dans compose.prod.yaml, résolu sur le réseau taskflow-prod.
  - job_name: taskflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
        labels:
          env: prod

  # Boîte noire : la sonde HTTP de blackbox sur /health, en passant par le front
  # (Nginx) comme le ferait un navigateur. Astuce classique : l'URL sondée devient
  # un paramètre (?target=...) et l'adresse réellement collectée est celle de blackbox.
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://front/health"]
        labels:
          env: prod
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # L'exporter blackbox lui-même
  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]
